<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <!-- The page carries no inline script, so scripts can be restricted to this
       origin: an injected <script> or event handler simply will not run. Style
       needs 'unsafe-inline' because the views set style attributes, and images
       allow https: because the map tile server is configurable.
       frame-ancestors cannot be set from a meta tag - see deploy/ for the
       server configuration that adds it. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    connect-src 'self';
    font-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self'">
  <title>Apiary-Journal</title>
  <!-- ?v= is the cache buster. Bump it whenever an asset below changes,
       otherwise browsers mix a fresh app.js with a cached schema.js. -->
  <link rel="stylesheet" href="assets/css/app.css?v=2026-08-07c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><polygon points='16,2 30,9 30,23 16,30 2,23 2,9' fill='%23D89A28'/></svg>">
</head>
<body>
  <noscript>
    <p style="padding:2rem;font:16px system-ui">
      Diese Anwendung benötigt JavaScript. / This application needs JavaScript.
    </p>
  </noscript>

  <script src="assets/js/i18n.js?v=2026-08-07c"></script>
  <script src="assets/js/schema.js?v=2026-08-07c"></script>
  <script src="assets/js/api.js?v=2026-08-07c"></script>
  <script src="assets/js/app.js?v=2026-08-07c"></script>
</body>
</html>
